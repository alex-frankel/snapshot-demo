name: Snapshot Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  snapshot-validate:
    name: Validate Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Run Snapshot Validate
        id: validate
        run: |
          OUTPUT=$(bicep snapshot main.bicepparam --mode validate 2>&1) || true
          echo "$OUTPUT"
          {
            echo 'SNAPSHOT_OUTPUT<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = process.env.SNAPSHOT_OUTPUT;
            const body = `## Bicep Snapshot Validation

            \`\`\`
            ${output}
            \`\`\`

            > Generated by \`bicep snapshot --mode validate\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Bicep Snapshot Validation')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
