name: Snapshot Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  snapshot-validate:
    name: Validate Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Fetch base branch snapshot
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
          git show ${{ github.event.pull_request.base.sha }}:main.snapshot.json > main.snapshot.json

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Run Snapshot Validate
        id: validate
        run: |
          OUTPUT=$(bicep snapshot main.bicepparam --mode validate \
            --subscription-id 996a2f3f-ee01-4ffd-9765-d2c3fc98f30a \
            --resource-group rg-snapshot-demo \
            --location eastus2 \
            --tenant-id 72f988bf-86f1-41af-91ab-2d7cd011db47 \
            2>&1 | sed 's/\x1b\[[0-9;]*m//g') || true
          echo "$OUTPUT"
          {
            echo 'SNAPSHOT_OUTPUT<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = process.env.SNAPSHOT_OUTPUT.trim();
            const hasChanges = output.includes('Snapshot validation failed');
            const icon = hasChanges ? '\u26a0\ufe0f' : '\u2705';
            const status = hasChanges ? 'Changes detected' : 'No changes detected';
            const body = [
              `## ${icon} Bicep Snapshot Validation — ${status}`,
              '',
              '```',
              output || 'No differences found.',
              '```',
              '',
              '> Generated by `bicep snapshot --mode validate`',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Bicep Snapshot Validation')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
